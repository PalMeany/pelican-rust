[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sea-orm = { version = "2", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }
tracing = "0.1"
rand = "0.9"
base64 = "0.22"

# Keep target dirs small (disk is tight): no debug info, no incremental cache.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
incremental = false

# The shipped binary: whole-program optimization (bench/README.md measures it).
[profile.release]
lto = "thin"
codegen-units = 1
