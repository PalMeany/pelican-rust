name: CI

on:
  push:
    branches: [main, "m*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # Database tests run against SQLite here; MariaDB/MySQL/PostgreSQL and the differential
      # tests against the original panel need the Docker stand (scripts/difftest).
      TEST_DB_DRIVERS: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
