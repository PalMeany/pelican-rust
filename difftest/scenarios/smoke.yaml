name: smoke/client-unauthenticated
description: Client API without credentials returns the Laravel JSON 401.
skip: GET /api/client (server list) lands with M4
steps:
  - path: /api/client
    expect_status: 401
  - path: /api/client
    accept_json: false
---
name: smoke/application-unauthenticated
skip: application users and remote routes land with M3/M5
steps:
  - path: /api/application/users
    expect_status: 401
  - path: /api/remote/servers
