name: remote/activity
fixtures: [base, infra]
steps:
  - method: POST
    path: /api/remote/activity
    bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL
    json:
      data:
        - { user: 6b9e5a5e-2222-4a5b-9c1d-000000000002, server: 0b5c6a0e-3f0e-4c1e-9d55-6c1d7c0a2d11, event: "server:sftp.write", metadata: { files: ["/a/b.txt", "ü"] }, ip: "192.168.1.5", timestamp: "2025-01-01T12:00:00.123456789Z" }
        - { user: null, server: 1c6d7b1f-4a1f-4d2e-8e66-7d2e8d1b3e22, event: "server:console.command", metadata: {}, ip: "", timestamp: "garbage" }
        - { user: 6b9e5a5e-1111-4a5b-9c1d-000000000001, server: 0b5c6a0e-3f0e-4c1e-9d55-6c1d7c0a2d11, event: "server:power.start", metadata: null, timestamp: "2025-01-01T12:00:00+02:00" }
        - { user: null, server: 2d7e8c2a-5b2a-4e3f-9f77-8e3f9e2c4f33, event: "server:other.node", metadata: [], timestamp: "2025-01-01T12:00:00Z" }
        - { user: null, server: 0b5c6a0e-3f0e-4c1e-9d55-6c1d7c0a2d11, event: "user:not.server", metadata: [], timestamp: "2025-01-01T12:00:00Z" }
        - { user: null, server: 0b5c6a0e-3f0e-4c1e-9d55-6c1d7c0a2d11, event: "server:list", metadata: ["x", "y"], timestamp: "bad" }
  - { method: POST, path: /api/remote/activity, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { data: [] } }
  - { method: POST, path: /api/remote/activity, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { data: [{ server: nope, event: 5, ip: "x" }] } }
