name: remote/sftp-password
description: SFTP auth with passwords, username parsing, permissions, throttling and state conflicts.
fixtures: [base, infra]
steps:
  # owner, correct password
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { type: password, username: user.0b5c6a0e, password: password }, expect_status: 200 }
  # full uuid + uppercase/space username, root admin who is also a subuser (admin permission list)
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { username: " ADMIN.0b5c6a0e-3f0e-4c1e-9d55-6c1d7c0a2d11", password: password } }
  # wrong password → activity + 403
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { type: password, username: user.0b5c6a0e, password: nope } }
  # unknown user, unknown server, other node's server, no server part
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { username: ghost.0b5c6a0e, password: password } }
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { username: user.ffffffff, password: password } }
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { username: user.2d7e8c2a, password: password } }
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { username: "user.", password: password } }
  # validation
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { type: magic, username: "", password: 5 } }
  # 5th failure for server 0b5c6a0e from this IP → throttled
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { username: user.0b5c6a0e, password: nope2 } }
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { username: user.0b5c6a0e, password: password } }
  # installing server (state conflict) for its owner (admin)
  - { method: POST, path: /api/remote/sftp/auth, bearer: difftestTokenId0.NodeDaemonToken0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKL, json: { username: admin.1c6d7b1f, password: password } }
