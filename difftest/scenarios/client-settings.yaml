name: client/settings-docker-image
fixtures: [base, infra, client-users, client-settings]
steps:
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { docker_image: ghcr.io/parkervcp/yolks:java_17 }, expect_status: 204 }
  # Back to the original image.
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { docker_image: ghcr.io/parkervcp/yolks:java_21 } }
  # Same image again: clean model, nothing written.
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { docker_image: ghcr.io/parkervcp/yolks:java_21 } }
  # Not offered by the egg -> Rule::in.
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { docker_image: ghcr.io/custom:nope } }
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user0000001UserClientSecret0000000000000001, json: {} }
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { docker_image: "" } }
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { docker_image: 123 } }
  # Current image pinned by an admin -> BadRequestHttpException 400.
  - { method: PUT, path: /api/client/servers/8f0f7a11/settings/docker-image, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { docker_image: ghcr.io/parkervcp/yolks:java_21 } }
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user3key001User3ClientSecret000000000001, json: { docker_image: ghcr.io/parkervcp/yolks:java_21 } }
  - { method: PUT, path: /api/client/servers/0b5c6a0e/settings/docker-image, bearer: pacc_user4key001User4ClientSecret000000000001, json: { docker_image: ghcr.io/parkervcp/yolks:java_21 } }
  - { method: PUT, path: /api/client/servers/1c6d7b1f/settings/docker-image, bearer: pacc_admin000001AdminClientSecret000000000000001, json: { docker_image: ghcr.io/parkervcp/yolks:java_21 } }

