name: client/files-write
fixtures: [base, infra, client-users]
wings:
  responses:
    - method: POST
      path: /api/servers/*/files/compress
      json: { name: "archive-2024.tar.gz", created: "2024-05-01T10:20:30Z", modified: "2024-05-01T10:20:30Z", mode: "-rw-r--r--", mode_bits: "644", size: 1234, directory: false, file: true, symlink: false, mime: "application/gzip" }
steps:
  - { method: POST, path: "/api/client/servers/0b5c6a0e/files/write?file=%2Fnew%20file.txt", bearer: pacc_user0000001UserClientSecret0000000000000001, body: "  hello\nworld  ", expect_status: 204 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/write, bearer: pacc_user0000001UserClientSecret0000000000000001, body: "x" }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/create-folder, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { name: " dir ", root: "/x" }, expect_status: 204 }
  - { method: POST, path: /api/client/servers/0b5c6a0e-3f0e-4c1e-9d55-6c1d7c0a2d11/files/create-folder, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { name: " dir " } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/create-folder, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { name: "dir", root: null } }
  - { method: PUT, path: /api/client/servers/0b5c6a0e/files/rename, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { root: "/", files: [{ from: "a/b.txt", to: "c.txt" }, { from: "d", to: "e" }] }, expect_status: 204 }
  - { method: PUT, path: /api/client/servers/0b5c6a0e/files/rename, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { root: "", files: [{ from: "a" }, "x"] } }
  - { method: PUT, path: /api/client/servers/0b5c6a0e/files/rename, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { root: "/", files: { "k": { from: "a", to: "b" } } } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/copy, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { location: "/a.txt" }, expect_status: 204 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/compress, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { files: ["a", "b/c"], extension: "zip" }, expect_status: 200 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/compress, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { root: "/r", files: ["a"], name: "n", extension: "rar" } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/decompress, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { file: "a.zip" }, expect_status: 204 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/delete, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { root: "/", files: ["a", "b"] }, expect_status: 204 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/delete, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { root: null, files: "a" } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/chmod, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { root: "/", files: [{ file: "a", mode: "755" }, { file: "b", mode: 644 }] }, expect_status: 204 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/chmod, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { root: "/", files: [{ file: "a", mode: "rwx" }] } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/pull, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { url: "https://example.com/file.zip?x=1", directory: "/dl", use_header: true, foreground: "0", filename: null }, expect_status: 204 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/pull, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { url: "not a url", use_header: "yes" } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/pull, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { url: "http://[::1]:8080/x" } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/delete, bearer: pacc_user3key001User3ClientSecret000000000001, json: { root: "/", files: ["a"] } }
