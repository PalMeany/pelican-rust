name: client/files-wings-errors
fixtures: [base, infra, client-users]
wings:
  responses:
    - { method: GET, path: /api/servers/*/files/contents, status: 404, json: { error: "not found" } }
    - { method: POST, path: /api/servers/*/files/write, status: 400, json: { error: "exists" } }
    - { method: GET, path: /api/servers/*/files/list-directory, status: 500, json: { error: "boom" } }
    - { method: POST, path: /api/servers/*/files/compress, json: { error: "no name" } }
steps:
  - { path: "/api/client/servers/0b5c6a0e/files/contents?file=x", bearer: pacc_user0000001UserClientSecret0000000000000001 }
  - { method: POST, path: "/api/client/servers/0b5c6a0e/files/write?file=x", bearer: pacc_user0000001UserClientSecret0000000000000001, body: "x" }
  - { path: /api/client/servers/0b5c6a0e/files/list, bearer: pacc_user0000001UserClientSecret0000000000000001 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/files/compress, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { files: ["a"] } }
