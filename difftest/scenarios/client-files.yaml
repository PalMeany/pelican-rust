name: client/files-read
fixtures: [base, infra, client-users]
wings:
  responses:
    - method: GET
      path: /api/servers/*/files/list-directory
      json:
        - { name: "docs", created: "2024-05-01T10:20:30Z", modified: "2024-05-02T11:00:00+03:00", mode: "drwxr-xr-x", mode_bits: "755", size: 4096, directory: true, file: false, symlink: false, mime: "inode/directory" }
        - { name: "server.properties", created: "2024-05-01T10:20:30Z", modified: "2024-05-01T10:20:31Z", mode: "-rw-r--r--", mode_bits: "644", size: "12", directory: false, file: true }
        - { name: 7, created: "2024-05-01T10:20:30-07:00", modified: "2024-05-01T10:20:30Z", mode: "Lrwxrwxrwx", mode_bits: "777", size: 0, file: 1, symlink: true, mime: "text/plain" }
    - { method: GET, path: /api/servers/*/files/contents, body: "motd=Привет, мир\nmax-players=20\n" }
steps:
  - { path: "/api/client/servers/0b5c6a0e-3f0e-4c1e-9d55-6c1d7c0a2d11/files/list?directory=%2F%20sub%20dir%20", bearer: pacc_user0000001UserClientSecret0000000000000001, expect_status: 200 }
  - { path: "/api/client/servers/0b5c6a0e/files/list?directory=%20x%2By%20", bearer: pacc_user0000001UserClientSecret0000000000000001 }
  - { path: /api/client/servers/0b5c6a0e/files/list, bearer: pacc_admin000001AdminClientSecret000000000000001 }
  - { path: "/api/client/servers/0b5c6a0e/files/list?directory[]=x", bearer: pacc_user0000001UserClientSecret0000000000000001 }
  - { path: /api/client/servers/0b5c6a0e/files/list, bearer: pacc_user3key001User3ClientSecret000000000001 }
  - { path: "/api/client/servers/0b5c6a0e/files/contents?file=%2Fserver.properties", bearer: pacc_user0000001UserClientSecret0000000000000001, expect_status: 200 }
  - { path: /api/client/servers/0b5c6a0e/files/contents, bearer: pacc_user0000001UserClientSecret0000000000000001 }
  - { path: "/api/client/servers/0b5c6a0e/files/download?file=%2Fa%2520b%20c.txt", bearer: pacc_user0000001UserClientSecret0000000000000001, expect_status: 200 }
  - { path: /api/client/servers/0b5c6a0e/files/upload, bearer: pacc_user0000001UserClientSecret0000000000000001, expect_status: 200 }
  - { path: /api/client/servers/0b5c6a0e/files/upload, bearer: pacc_user3key001User3ClientSecret000000000001 }
