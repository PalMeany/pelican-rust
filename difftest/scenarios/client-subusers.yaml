name: client/subusers-create
fixtures: [base, infra, client-users]
normalize:
  random_patterns: ['newperson[A-Za-z0-9]{3}']
steps:
  - { method: POST, path: /api/client/servers/0b5c6a0e/users, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { email: "NewPerson@Example.com", permissions: ["control.console", "file.read", "bogus.perm", "control.console"] }, expect_status: 200 }
  - { method: POST, path: /api/client/servers/0b5c6a0e/users, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { email: stranger@example.com, permissions: ["backup.read"] } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/users, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { email: user@example.com, permissions: [] } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/users, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { email: Sub.User@Example.com, permissions: ["file.read"] } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/users, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { email: "bad", permissions: "x" } }
