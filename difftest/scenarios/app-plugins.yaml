  - { method: POST, path: /api/application/plugins/alpha/disable, bearer: papp_admin000001AdminAppSecret000000000000000001 }
  - { method: POST, path: /api/application/plugins/alpha/disable, bearer: papp_admin000001AdminAppSecret000000000000000001 }
  - { method: POST, path: /api/application/plugins/beta/enable, bearer: papp_admin000001AdminAppSecret000000000000000001 }
  - { method: POST, path: /api/application/plugins/beta/enable, bearer: papp_admin000001AdminAppSecret000000000000000001 }
