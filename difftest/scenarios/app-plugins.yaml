  - { method: POST, path: /api/application/plugins/gamma/disable, bearer: papp_admin000001AdminAppSecret000000000000000001 }
  - { method: POST, path: /api/application/plugins/gamma/uninstall, bearer: papp_admin000001AdminAppSecret000000000000000001 }
  - { method: POST, path: /api/application/plugins/beta/install, bearer: papp_admin000001AdminAppSecret000000000000000001 }
  - { method: POST, path: /api/application/plugins/beta/update, bearer: papp_admin000001AdminAppSecret000000000000000001 }
  - { method: POST, path: /api/application/plugins/beta/uninstall, bearer: papp_admin000001AdminAppSecret000000000000000001, json: { delete: maybe } }
  - { path: /api/application/plugins/delta, bearer: papp_admin000001AdminAppSecret000000000000000001 }
  - { method: POST, path: /api/application/plugins/missing/enable, bearer: papp_admin000001AdminAppSecret000000000000000001 }
