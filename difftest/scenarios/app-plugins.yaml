name: app/plugins-state
description: Enable/disable transitions, the refused ones, and the rewritten plugin.json files.
fixtures: [base, infra, app-extra]
plugins:
  alpha:
    plugin.json: { id: alpha, name: Alpha, author: Jane, category: plugin, namespace: "Jane\\Alpha", class: AlphaPlugin, url: "https://example.com/a/b", description: "Ünïcode ✓", extra: {}, meta: { status: enabled, load_order: 3, note: kept } }
  beta:
    plugin.json: { id: beta, name: Beta, author: Bob, category: plugin, namespace: "Bob\\Beta", class: BetaPlugin, meta: { status: disabled } }
  gamma:
    plugin.json: { id: gamma, name: Gamma, author: Anna, category: plugin, namespace: "Anna\\Gamma", class: GammaPlugin }
  delta:
    plugin.json: { id: delta, name: Delta, author: Dan, category: plugin, namespace: "Dan\\Delta", class: DeltaPlugin, meta: { status: incompatible, status_message: old } }
