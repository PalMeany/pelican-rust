  - { method: POST, path: /api/client/servers/0b5c6a0e/schedules, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { name: "Bad", minute: "61", hour: "*", day_of_month: "*", month: "*", day_of_week: "*", is_active: true } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/schedules, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { name: "", minute: 5, is_active: null, only_when_online: "yes" } }
