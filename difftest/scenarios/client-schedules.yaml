  - { method: POST, path: /api/client/servers/0b5c6a0e/schedules/1, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { name: "Daily restart", minute: "0", hour: "4", day_of_month: "1", month: "*", day_of_week: "*", is_active: "1" } }
  - { method: POST, path: /api/client/servers/0b5c6a0e/schedules/3/tasks, bearer: pacc_user0000001UserClientSecret0000000000000001, json: { action: command, payload: "say a", time_offset: 0 }, expect_status: 200 }
