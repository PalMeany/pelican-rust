  - { method: DELETE, path: /api/client/servers/0b5c6a0e/schedules/1/tasks/3, bearer: pacc_user0000001UserClientSecret0000000000000001, expect_status: 204 }
  - { method: DELETE, path: /api/client/servers/0b5c6a0e/schedules/1/tasks/1, bearer: pacc_user3key001User3ClientSecret000000000001 }
