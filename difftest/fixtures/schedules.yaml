# Schedules and tasks of server 1 (and one of server 2 for scoping checks).
schedules:
  - { id: 1, server_id: 1, name: "Daily restart", cron_day_of_week: "*", cron_day_of_month: "1", cron_hour: "4", cron_minute: "0", cron_month: "*", is_active: true, is_processing: false, only_when_online: 0, timezone: UTC, last_run_at: null, next_run_at: "2026-01-02 04:00:00", created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
