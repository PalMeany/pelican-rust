  - { id: 3, server_id: 1, name: "Builder", cron_day_of_week: "*", cron_day_of_month: "1", cron_hour: "0", cron_minute: "30", cron_month: "*", is_active: true, is_processing: false, only_when_online: 0, timezone: UTC, last_run_at: null, next_run_at: null, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
  - { id: 4, server_id: 2, name: "Other server", cron_day_of_week: "*", cron_day_of_month: "*", cron_hour: "*", cron_minute: "*", cron_month: "*", is_active: true, is_processing: false, only_when_online: 0, timezone: UTC, last_run_at: null, next_run_at: null, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
  - { id: 5, server_id: 1, name: "Empty", cron_day_of_week: "*", cron_day_of_month: "*", cron_hour: "*", cron_minute: "*", cron_month: "*", is_active: true, is_processing: false, only_when_online: 0, timezone: UTC, last_run_at: null, next_run_at: null, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
tasks:
  - { id: 1, schedule_id: 1, sequence_id: 1, action: command, payload: "say restarting", time_offset: 0, is_queued: false, continue_on_failure: 0, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
  - { id: 2, schedule_id: 1, sequence_id: 2, action: power, payload: restart, time_offset: 5, is_queued: false, continue_on_failure: 0, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
  - { id: 3, schedule_id: 1, sequence_id: 3, action: delete_files, payload: "/logs/*.log\nx.txt", time_offset: 0, is_queued: false, continue_on_failure: 0, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
  - { id: 4, schedule_id: 1, sequence_id: 4, action: backup, payload: "*.tmp\n\ncache/", time_offset: 0, is_queued: false, continue_on_failure: 0, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
  - { id: 5, schedule_id: 2, sequence_id: 1, action: command, payload: "save-all", time_offset: 0, is_queued: false, continue_on_failure: 0, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
  - { id: 6, schedule_id: 4, sequence_id: 1, action: command, payload: "x", time_offset: 0, is_queued: false, continue_on_failure: 0, created_at: "2026-01-01 00:00:00", updated_at: "2026-01-01 00:00:00" }
