eggs:
  - id: 1
    uuid: 5b1d4a0c-1111-4abc-9def-000000000001
    name: Paper
    author: panel@example.com
    description: "Paper is a Minecraft server — fast/forked"
    features: ["eula", "java_version", "unknown_feature"]
    docker_images: { "Java 21": "ghcr.io/parkervcp/yolks:java_21", "Java 17": "ghcr.io/parkervcp/yolks:java_17" }
    file_denylist: ["*.secret", "config/locked.yml"]
    update_url: null
    tags: ["minecraft"]
    startup_commands: { "Default": "java -Xms128M -jar {{SERVER_JARFILE}}" }
    config_files: '{"server.properties":{"parser":"properties","find":{"server-ip":"{{server.allocations.default.ip}}","server-port":"{{server.allocations.default.port}}","query.port":"{{server.allocations.default.port}}","motd":"{{env.MOTD}} on {{server.uuid}} / {{config.docker.interface}}","max-players":"{{env.MAX_PLAYERS}}","enable-query":true,"online-mode":{"true":"{{env.ONLINE}}","false":"off"}}},"config/paper.yml":{"parser":"yaml","find":{"settings.velocity.secret":"{{server.environment.SECRET}}","memory":"{{server.build.memory_limit}}","legacy":"{{server.build.default.port}}","nested":{"a":"{{env.MOTD}}"}}},"ignored.txt":{"parser":"file"}}'
    config_startup: '{"done":")! For help, type ","strip_ansi":false}'
    config_logs: '{}'
    config_stop: stop
    config_from: null
    script_install: "#!/bin/ash\n# install script with / slashes and ünicode\ncurl -o server.jar https://example.com/paper.jar\n"
    script_is_privileged: 1
    script_entry: ash
    script_container: ghcr.io/parkervcp/installers:alpine
    copy_script_from: null
    force_outgoing_ip: 0
    created_at: "2026-01-01 00:00:00"
    updated_at: "2026-01-01 00:00:00"
  - id: 2
    uuid: 5b1d4a0c-2222-4abc-9def-000000000002
    name: Paper Child
    author: panel@example.com
    description: inherits config and script
    features: null
    docker_images: { "Java 21": "ghcr.io/parkervcp/yolks:java_21" }
    file_denylist: ["child-only.txt"]
    tags: []
    startup_commands: { "Default": "./start.sh" }
    config_files: null
    config_startup: null
    config_logs: null
    config_stop: "^C"
    config_from: 1
    script_install: null
    script_is_privileged: 1
    script_entry: ""
    script_container: ""
    copy_script_from: 1
    force_outgoing_ip: 1
    created_at: "2026-01-01 00:00:00"
    updated_at: "2026-01-01 00:00:00"
