[package]
name = "pelican"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "pelican-rs panel binary"

[dependencies]
pelican-wings = { path = "../pelican-wings" }
sea-orm.workspace = true
pelican-core = { path = "../pelican-core" }
pelican-api = { path = "../pelican-api" }
egg-format = { path = "../egg-format" }
pelican-web = { path = "../pelican-web" }
pelican-db = { path = "../pelican-db" }
pelican-plugins = { path = "../pelican-plugins" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
rand.workspace = true
base64.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
deunicode = "1"
mimalloc = { version = "0.1", default-features = false }
axum = "0.8"
tower = "0.5"
