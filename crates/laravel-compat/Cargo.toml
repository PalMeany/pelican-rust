[package]
name = "laravel-compat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Laravel/PHP compatible formats: encrypter, serialize, json_encode, bcrypt"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
base64.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex = "0.4"
bcrypt = "0.19"
