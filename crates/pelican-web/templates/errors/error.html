<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ asset('css/app.css') }}">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<main class="simple">
  <div class="empty">
    <h1 style="font-size:3rem;font-weight:700;letter-spacing:-0.04em">{{ code }}</h1>
    <p class="muted" style="font-size:1.125rem">{{ title }}</p>
    <a class="btn btn-gray mt-4" href="/">{{ icon('arrow-left', 'icon-sm') }} Home</a>
  </div>
</main>
</body>
</html>
