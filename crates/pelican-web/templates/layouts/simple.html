{% extends "layouts/base.html" %}
{% block body %}
<main class="simple">
  <div class="simple-card">
    <div class="logo">{% if app_logo %}<img src="{{ app_logo }}" alt="{{ trans('filament-panels::layout.logo.alt', name=app_name) }}">{% else %}<span class="brand-name">{{ app_name }}</span>{% endif %}</div>
    {% block card %}{% endblock %}
  </div>
  {% include "components/footer.html" %}
</main>
{% endblock %}
