[package]
name = "pelican-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Domain logic of pelican-rs: config, auth, permissions, services"

[dependencies]
pelican-db = { path = "../pelican-db" }
laravel-compat = { path = "../laravel-compat" }
pelican-wings = { path = "../pelican-wings" }
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
anyhow.workspace = true
rand.workspace = true
uuid.workspace = true
parking_lot = "0.12"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
base64.workspace = true
hmac = "0.12"
subtle = "2"
p256 = "0.13"
rsa = { version = "0.9", features = ["sha2"] }
ciborium = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "sendmail-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }

[dev-dependencies]
pelican-db = { path = "../pelican-db", features = ["testing"] }
