[package]
name = "pelican-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HTTP layer of pelican-rs: remote, client and application APIs"

[dependencies]
pelican-core = { path = "../pelican-core" }
pelican-db = { path = "../pelican-db" }
laravel-compat = { path = "../laravel-compat" }
pelican-wings = { path = "../pelican-wings" }
cron-php = { path = "../cron-php" }
egg-format = { path = "../egg-format" }
chrono-tz = "0.10"
base64.workspace = true
sha2 = "0.10"
sha1 = "0.10"
uuid.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
indexmap = { version = "2", features = ["serde"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
http-body-util = "0.1"
bytes = "1"
md-5 = "0.10"
hex = "0.4"
fancy-regex = "0.14"
regex = "1"
rand.workspace = true
